<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elektriseermachines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrumentenkast — 3D-scène bovenaan, bediening en meetwaarden eronder. Bewust één donker thema: vonken en ladingsgloed lezen het best op donker. */
:root{
  --bg:#141210;
  --panel:#1d1a16;
  --line:#3a332a;
  --fg:#ece4d6;
  --muted:#a59a87;
  --brass:#c9a35a;
  --pos:#ef6a43;
  --neg:#55a8ec;
  --spark:#e9f1ff;
  --f-display:"IM Fell DW Pica", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:grid;gap:4px}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 i{color:var(--brass)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:500 15px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--bg);background:var(--brass);border-color:var(--brass)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.stage{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.view{position:relative;width:100%;aspect-ratio:16/10;max-width:100%}
@media (max-width:640px){.view{aspect-ratio:1/1}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font:500 12px var(--f-body);color:var(--fg);background:rgba(20,18,16,.72);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap}
.lbl.pos{color:var(--pos)} .lbl.neg{color:var(--neg)}
.hint{position:absolute;left:10px;bottom:8px;font:12px var(--f-data);color:var(--muted);pointer-events:none}
.resetv{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;font:500 13px var(--f-body);background:rgba(20,18,16,.75);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
#chart{display:block;width:100%;height:90px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}}
.controls{display:grid;gap:14px;align-content:start}
.ctl{display:grid;gap:4px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.ctl output{font-family:var(--f-data);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brass)}
.row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.check input{accent-color:var(--brass);width:18px;height:18px}
.btn{font:700 15px var(--f-body);border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--brass);background:transparent;color:var(--brass)}
.btn.primary{background:var(--brass);color:var(--bg)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;align-content:start}
.cell{background:var(--panel);padding:10px 12px;display:grid;gap:2px}
.cell span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell b{font:500 22px var(--f-data);font-variant-numeric:tabular-nums}
.cell b small{font-size:13px;color:var(--muted);margin-left:3px}
.msg{grid-column:1/-1;background:var(--panel);padding:10px 12px;min-height:44px;font-size:15px}
.msg.hit{color:var(--spark)}
.text{display:grid;gap:10px;max-width:68ch}
.text h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.text p{margin:0}
.model{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted);max-width:75ch}
.model b{color:var(--fg);font-weight:500}
.model ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.err{padding:20px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Elektrostatica · interactief 3D-model</div>
    <h1>Elektriseermachines <i>in werking</i></h1>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-wim" aria-selected="true">Wimshurst (1883)</button>
    <button class="tab" role="tab" id="tab-fric" aria-selected="false">Wrijvingsmachine, Leiden 1746</button>
  </div>

  <div class="stage">
    <div class="view" id="view">
      <canvas id="gl" aria-label="3D-model van de elektriseermachine; sleep om te draaien"></canvas>
      <div id="labels"></div>
      <button class="resetv" id="resetView">Beginaanzicht</button>
      <div class="hint">sleep = draaien · scroll/knijp = zoomen</div>
    </div>
    <canvas id="chart" aria-label="Spanning in functie van de tijd"></canvas>
  </div>

  <div class="grid">
    <div class="controls">
      <div class="ctl">
        <label for="speed">Toerental <output id="speedOut">0,0 omw/s</output></label>
        <input type="range" id="speed" min="0" max="4" step="0.1" value="0">
      </div>
      <div class="ctl" id="gapCtl">
        <label for="gap">Vonkbrug (afstand tussen de bollen) <output id="gapOut">10 mm</output></label>
        <input type="range" id="gap" min="2" max="25" step="1" value="10">
      </div>
      <label class="check"><input type="checkbox" id="jars" checked> <span id="jarsLbl">Schakelaar buitenbekledingen gesloten</span></label>
      <div class="row">
        <label class="check"><input type="checkbox" id="showLoop" checked> Toon stroomkring</label>
        <label class="check"><input type="checkbox" id="showLabels" checked> Toon benamingen</label>
      </div>
      <div class="row">
        <button class="btn primary" id="crank">Draai aan de slinger</button>
        <button class="btn" id="discharge">Schuif de bollen samen</button>
      </div>
    </div>
    <div class="readout">
      <div class="cell"><span id="vLbl">Spanning over de vonkbrug</span><b id="rV">0,0<small>kV</small></b></div>
      <div class="cell"><span>Lading op de condensator</span><b id="rQ">0<small>nC</small></b></div>
      <div class="cell"><span>Opgeslagen energie</span><b id="rE">0<small>mJ</small></b></div>
      <div class="cell"><span id="bLbl">Doorslag bij</span><b id="rB">30<small>kV</small></b></div>
      <div class="msg" id="msg">Zet de schijven in beweging met de slinger of de schuifregelaar.</div>
    </div>
  </div>

  <section class="text" id="txt"></section>
  <section class="model" id="model"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
if(!window.THREE){ document.getElementById('view').innerHTML='<p class="err">De 3D-bibliotheek kon niet geladen worden. Herlaad de pagina.</p>'; return; }

// ================= declaratie =================
const $ = id => document.getElementById(id);
const cs = getComputedStyle(document.documentElement);
const tok = n => cs.getPropertyValue(n).trim();
const COL = { pos:new THREE.Color(tok('--pos')), neg:new THREE.Color(tok('--neg')), bg:tok('--bg'), muted:tok('--muted'), brass:tok('--brass'), spark:tok('--spark') };
const nf = (x,d=1) => x.toLocaleString('nl-BE',{minimumFractionDigits:d,maximumFractionDigits:d});
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const UP = V3(0,1,0);
const E_BREAK = 3000; // V/mm, homogeen veld, droge lucht (model)

const S = { mode:'wim', rps:0, gap:10, strap:true, bottle:true, showLoop:true, showLabels:true, t:0, msg:'', hit:false };

const machines = {
  wim: { V:0, max:0, angle:0, history:[], gapEff:10, closing:0, spark:null,
    C(){ return S.strap ? 275e-12 : 25e-12; },   // 2 flessen van 500 pF in serie + strooicapaciteit
    I(rps,V){ return 2.5e-6*rps*(0.15+0.85*Math.min(1,V/5000)); },
    R:60e9 },
  fric:{ V:0, max:0, angle:0, history:[], reach:0, touching:0, hold:0, spark:null,
    C(){ return S.bottle ? 500e-12 : 15e-12; },
    I(rps){ return 1.0e-6*rps; },
    R:2e10 }
};

// ================= three.js basis =================
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.setClearColor(COL.bg);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(COL.bg, 220, 420);
const camera = new THREE.PerspectiveCamera(38, 1.6, 1, 1000);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x2a2018, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(60,110,90); scene.add(sun);
const fill = new THREE.PointLight(0xffd9a0, 0.5, 300); fill.position.set(-80,60,40); scene.add(fill);
const flash = new THREE.PointLight(0xbfd4ff, 0, 160); scene.add(flash);
const floor = new THREE.Mesh(new THREE.CircleGeometry(240,64), new THREE.MeshStandardMaterial({color:0x1c1814, roughness:1}));
floor.rotation.x = -Math.PI/2; floor.position.y = -3.01; scene.add(floor);

const M = {
  brass: () => new THREE.MeshStandardMaterial({color:0xc9a35a, metalness:.65, roughness:.32, emissive:0x000000}),
  tin:   () => new THREE.MeshStandardMaterial({color:0xb8b5ad, metalness:.7, roughness:.35, emissive:0x000000}),
  wood:  new THREE.MeshStandardMaterial({color:0x5a3d27, roughness:.75}),
  dark:  new THREE.MeshStandardMaterial({color:0x3a281b, roughness:.8}),
  ebon:  new THREE.MeshStandardMaterial({color:0x121110, roughness:.35}),
  iron:  () => new THREE.MeshStandardMaterial({color:0x4a4845, metalness:.7, roughness:.45, emissive:0x000000}),
  belt:  new THREE.MeshStandardMaterial({color:0x6b4a2e, roughness:.9}),
  glass: new THREE.MeshStandardMaterial({color:0xcfe8ee, transparent:true, opacity:.16, roughness:.05, depthWrite:false, side:THREE.DoubleSide}),
  disc:  new THREE.MeshStandardMaterial({color:0xa9cdd6, transparent:true, opacity:.22, roughness:.05, depthWrite:false, side:THREE.DoubleSide}),
  water: new THREE.MeshStandardMaterial({color:0x5f8fa3, transparent:true, opacity:.55, roughness:.2, emissive:0x000000}),
  silk:  new THREE.MeshStandardMaterial({color:0xefe6cf, roughness:.9}),
  leather:new THREE.MeshStandardMaterial({color:0x7a4a2a, roughness:.85, emissive:0x000000}),
  skin:  new THREE.MeshStandardMaterial({color:0xb88d6c, roughness:.7, emissive:0x000000}),
  cloth: new THREE.MeshStandardMaterial({color:0x3b3f52, roughness:.95, emissive:0x000000}),
  brush: new THREE.MeshStandardMaterial({color:0xe8d7a8, roughness:.6})
};

function mesh(geo, mat, x=0,y=0,z=0){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); return m; }
function rod(a,b,r,mat,seg=16){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,seg),mat); setRod(m,a,b); return m; }
function setRod(m,a,b){ const d=new THREE.Vector3().subVectors(b,a); const L=Math.max(1e-3,d.length()); m.position.copy(a).addScaledVector(d,.5); m.scale.set(1,L,1); m.quaternion.setFromUnitVectors(UP,d.divideScalar(L)); }
function sphere(r,mat,p){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat); if(p) m.position.copy(p); return m; }
function glowMat(color,op){ return new THREE.MeshBasicMaterial({color, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false}); }

// labels
const labelLayer = $('labels');
const labels = []; // {el, pos, group}
function addLabel(group, text, pos, cls=''){ const el=document.createElement('div'); el.className='lbl '+cls; el.textContent=text; labelLayer.appendChild(el); labels.push({el,pos,group}); return el; }

// stroomkring: lijn + pulsen
function makeLoop(group, segments){
  // segments: [{pts:[V3...], dashed:bool}]
  const lines=[];
  for(const s of segments){
    const geo=new THREE.BufferGeometry().setFromPoints(s.pts);
    const mat = s.dashed ? new THREE.LineDashedMaterial({color:0xfff2c0, dashSize:1, gapSize:1, transparent:true, opacity:.8})
                         : new THREE.LineBasicMaterial({color:0xfff2c0, transparent:true, opacity:.75});
    const l=new THREE.Line(geo,mat); if(s.dashed) l.computeLineDistances(); l.renderOrder=5; group.add(l); lines.push(l);
  }
  return lines;
}
function makePath(pts){ const p=new THREE.CurvePath(); for(let i=0;i<pts.length-1;i++) p.add(new THREE.LineCurve3(pts[i],pts[i+1])); return p; }
function makePulses(group, n){ const arr=[]; const mat=glowMat(0xfff6d0,1); for(let i=0;i<n;i++){ const s=sphere(.55,mat); s.visible=false; group.add(s); arr.push(s);} return {arr,mat}; }

// vonk
function buildSpark(a,b,E){
  const g=new THREE.Group();
  const d=new THREE.Vector3().subVectors(b,a), L=d.length();
  const n1=new THREE.Vector3(0,1,0).cross(d).normalize(); if(n1.lengthSq()<.1) n1.set(1,0,0);
  const n2=new THREE.Vector3().crossVectors(d,n1).normalize();
  const pts=[]; const N=14, amp=Math.min(1.6,L*.18);
  for(let i=0;i<=N;i++){ const t=i/N, e=(i===0||i===N)?0:1; pts.push(a.clone().addScaledVector(d,t).addScaledVector(n1,e*(Math.random()*2-1)*amp).addScaledVector(n2,e*(Math.random()*2-1)*amp)); }
  const curve=new THREE.CatmullRomCurve3(pts);
  const r=Math.min(.42, .07+.05*Math.sqrt(E*1e3));
  const core=new THREE.Mesh(new THREE.TubeGeometry(curve,60,r,6,false), glowMat(0xf4f8ff,1));
  const halo=new THREE.Mesh(new THREE.TubeGeometry(curve,60,r*3.5,8,false), glowMat(0x8fb4ff,.28));
  g.add(core,halo); g.userData={mats:[core.material,halo.material], base:[1,.28]};
  return g;
}

// ================= Wimshurst =================
const wim = new THREE.Group(); scene.add(wim);
const AX = 34, R = 20;
{
  wim.add(mesh(new THREE.BoxGeometry(82,3,34), M.wood, 0,-1.5,0));
  wim.add(mesh(new THREE.BoxGeometry(84,.6,36), M.dark, 0,-3,0));
  for(const z of [-6,6]){ wim.add(mesh(new THREE.BoxGeometry(3,AX+2,2.4), M.dark, 0,(AX+2)/2,z)); }
  const axle=mesh(new THREE.CylinderGeometry(.6,.6,13,16), M.brass(), 0,AX,0); axle.rotation.x=Math.PI/2; wim.add(axle);
}
const sectorMats = {front:[], back:[]};
const discs = {};
function buildDisc(key, z, faceSign){
  const g=new THREE.Group(); g.position.set(0,AX,z);
  const d=mesh(new THREE.CylinderGeometry(R,R,.4,72), M.disc); d.rotation.x=Math.PI/2; g.add(d);
  const rim=mesh(new THREE.TorusGeometry(R,.12,6,72), M.glass); g.add(rim);
  for(let i=0;i<24;i++){
    const beta=i*2*Math.PI/24;
    const mat=M.tin(); sectorMats[key].push({mat,beta});
    const s=mesh(new THREE.BoxGeometry(1.5,6.2,.1), mat, R*.79*Math.sin(beta), R*.79*Math.cos(beta), faceSign*.26);
    s.rotation.z=-beta; g.add(s);
  }
  const pul=mesh(new THREE.CylinderGeometry(2.2,2.2,.9,24), M.wood, 0,0,faceSign*.75); pul.rotation.x=Math.PI/2; g.add(pul);
  // spaken op de poelie maken de draaiing zichtbaar
  for(let k=0;k<3;k++){ const sp=mesh(new THREE.BoxGeometry(.25,4.2,.15), M.dark, 0,0,faceSign*1.22); sp.rotation.z=k*Math.PI/3; g.add(sp); }
  wim.add(g); discs[key]=g;
}
buildDisc('front', 1.0, +1);
buildDisc('back', -1.0, -1);
// neutralisatoren
for(const [z,rot,fs] of [[3.0,Math.PI/4,1],[-3.0,-Math.PI/4,-1]]){
  const g=new THREE.Group(); g.position.set(0,AX,z); g.rotation.z=rot;
  g.add(rod(V3(0,-18.6,0),V3(0,18.6,0),.28,M.brass()));
  g.add(sphere(.8,M.brass()));
  for(const yy of [-18.2,18.2]) for(let k=-2;k<=2;k++){ g.add(rod(V3(k*.28,yy,0),V3(k*.28,yy,-fs*1.5),.07,M.brush,4)); }
  wim.add(g);
}
// aandrijving: as, poelies, riemen (achterste gekruist), slinger
const drive=new THREE.Group(); drive.position.set(0,6,0); wim.add(drive);
{ const sh=mesh(new THREE.CylinderGeometry(.6,.6,20,16), M.brass(), 0,6,3); sh.rotation.x=Math.PI/2; wim.add(sh); }
const drivePulleys=[];
for(const z of [1.7,-1.7]){ const p=new THREE.Group(); p.position.set(0,6,z); const c=mesh(new THREE.CylinderGeometry(5,5,.9,32), M.wood); c.rotation.x=Math.PI/2; p.add(c); for(let k=0;k<3;k++){ const sp=mesh(new THREE.BoxGeometry(.35,9.4,.2), M.dark,0,0,Math.sign(z)*.5); sp.rotation.z=k*Math.PI/3; p.add(sp);} wim.add(p); drivePulleys.push(p); }
// riemen: voor recht, achter gekruist
wim.add(rod(V3(2.2,AX,1.7),V3(5,6,1.7),.22,M.belt,6)); wim.add(rod(V3(-2.2,AX,1.7),V3(-5,6,1.7),.22,M.belt,6));
wim.add(rod(V3(2.2,AX,-1.7),V3(-5,6,-1.7),.22,M.belt,6)); wim.add(rod(V3(-2.2,AX,-1.7),V3(5,6,-1.7),.22,M.belt,6));
const crank=new THREE.Group(); crank.position.set(0,6,13); wim.add(crank);
crank.add(mesh(new THREE.BoxGeometry(1.2,8,.8), M.brass(), 0,4,0));
{ const h=mesh(new THREE.CylinderGeometry(.7,.7,4,12), M.ebon, 0,8,2); h.rotation.x=Math.PI/2; crank.add(h); }

// geleiders per zijde (rechts +, links −)
const wimSide = {};
for(const s of [1,-1]){
  const brass=M.brass(), tinOut=M.tin(), tinIn=M.tin();
  const X=29*s;
  // kam: vork rond beide schijven
  const fork=new THREE.Group(); wim.add(fork);
  fork.add(rod(V3(X,AX,0),V3(21.8*s,AX,0),.45,brass));
  fork.add(rod(V3(21.8*s,AX,-2.4),V3(21.8*s,AX,2.4),.45,brass));
  for(const z of [-2.4,2.4]){
    fork.add(rod(V3(21.8*s,AX,z),V3(13.5*s,AX,z),.35,brass));
    for(let x=14;x<=21;x+=1.1){ const tooth=new THREE.Mesh(new THREE.ConeGeometry(.18,.9,6),brass); tooth.position.set(x*s,AX,z-Math.sign(z)*.6); tooth.rotation.x=Math.sign(z)>0?-Math.PI/2:Math.PI/2; fork.add(tooth); }
  }
  const knob=sphere(1.8,brass,V3(X,AX,0)); wim.add(knob);
  // Leidse fles onder de kam
  const jarG=new THREE.Group(); jarG.position.set(X,0,0); wim.add(jarG);
  jarG.add(mesh(new THREE.CylinderGeometry(4.6,4.6,21,40,1,true), M.glass, 0,10.5,0));
  { const bt=mesh(new THREE.CircleGeometry(4.6,40), M.glass, 0,.05,0); bt.rotation.x=-Math.PI/2; jarG.add(bt); }
  jarG.add(mesh(new THREE.CylinderGeometry(4.75,4.75,12.5,40,1,true), tinOut, 0,6.5,0));
  jarG.add(mesh(new THREE.CylinderGeometry(4.35,4.35,12.5,40,1,true), tinIn, 0,6.5,0));
  jarG.add(mesh(new THREE.CylinderGeometry(4.9,4.9,1,40), M.dark, 0,21.3,0));
  wim.add(rod(V3(X,1.5,0),V3(X,AX-1.6,0),.32,brass));            // binnenstaaf: binnenbekleding → kam
  wim.add(rod(V3(X-.9,1.2,0),V3(X+.9,1.2,0),.2,brass));            // kettinkje op de bodem (contact binnenfolie)

// ================= logica (geen output) =================
function charge(m,dt){
  m.angle += S.rps*2*Math.PI*dt;
  const Cc=m.C();
  m.V += (m.I(S.rps,m.V) - m.V/m.R)/Cc*dt;
  if(m.V<0) m.V=0;
  m.max=Math.max(m.max,m.V);
}
function stepWim(m,dt){
  charge(m,dt);
  // bollen samenschuiven en terug
  if(m.closing===1){ m.gapEff=Math.max(0,m.gapEff-30*dt); if(m.gapEff===0){ if(m.V>50){ m.V=0; say('Contact zonder vonk: de restspanning was te klein voor doorslag.'); } m.closing=2; } }
  else if(m.closing===2){ m.gapEff=Math.min(S.gap,m.gapEff+20*dt); if(m.gapEff>=S.gap) m.closing=0; }
  else m.gapEff=S.gap;
  if(m.V>=E_BREAK*m.gapEff && m.V>300){
    const E=.5*m.C()*m.V*m.V;
    m.spark={t:0,E,gap:m.gapEff};
    say(`Vonk: ${nf(E*1e3,E<.01?2:0)} mJ over ${nf(m.gapEff,0)} mm.${S.strap?' De flessen ontladen via de vonkbrug.':' Zonder flessen: kleine capaciteit, dunne vonk.'}`, true);
    m.V*=.02; if(m.closing===1) m.closing=2;
    return true;
  }
  return false;
}
function stepFric(m,dt){
  charge(m,dt);
  if(m.touching===1){ m.reach=Math.min(1,m.reach+.7*dt);
    const tip=FINGER_REST.clone().lerp(FINGER_TOUCH,easeInOut(m.reach)); const gapMm=Math.max(0,(tip.distanceTo(FINGER_TOUCH)))*10;
    if(m.V>800 && m.V>=E_BREAK*gapMm){ shock(m); m.touching=2; }
    else if(m.reach>=1){ if(m.V>50) shock(m,true); else say('Niets gevoeld: de loop was nauwelijks geladen.'); m.touching=2; }
  } else if(m.touching===2){ m.hold+=dt; if(m.hold>.9) m.touching=3; }
  else if(m.touching===3){ m.reach=Math.max(0,m.reach-.9*dt); if(m.reach===0) m.touching=0; }
}
function shock(m,contact=false){
  const E=.5*m.C()*m.V*m.V, V=m.V; m.V=0;
  m.spark={t:0,E,contact};
  if(!S.bottle) say(`Een tikje en een kleine vonk (${nf(E*1e3,2)} mJ bij ${nf(V/1000,1)} kV): alleen de loop was geladen.`,true);
  else say(`Schok door armen en borst: ${nf(E*1e3,0)} mJ bij ${nf(V/1000,1)} kV. De stroom loopt van het water via loop, vinger, armen en borst naar de hand rond de fles.`,true);
}

function signFront(th){ if(th>=315||th<90) return 1; if(th>=135&&th<270) return -1; return 0; }
function signBack(th){ if(th>=270||th<45) return -1; if(th>=90&&th<225) return 1; return 0; }
const tmpC=new THREE.Color();
function setEm(mat,sign,amt){ if(sign===0||amt<=0){ mat.emissive.setRGB(0,0,0); return; } tmpC.copy(sign>0?COL.pos:COL.neg).multiplyScalar(amt); mat.emissive.copy(tmpC); }

let sparkMesh=null, sparkOwner=null;
function showSpark(group,a,b,E){ if(sparkMesh){ sparkOwner.remove(sparkMesh); } sparkMesh=buildSpark(a,b,E); sparkOwner=group; group.add(sparkMesh); flash.position.copy(a).lerp(b,.5); }
function fadeSpark(sp){
  if(!sparkMesh) return;
  const a=Math.max(0,1-sp.t/.28);
  sparkMesh.userData.mats.forEach((mm,i)=>mm.opacity=sparkMesh.userData.base[i]*a);
  flash.intensity = 3.5*a*Math.min(1,Math.sqrt(sp.E*1e3)/4+.15);
  if(a===0){ sparkOwner.remove(sparkMesh); sparkMesh=null; flash.intensity=0; }
}
function runPulses(p,paths,sp,dur){
  const on = sp && sp.t<dur;
  p.arr.forEach(s=>s.visible=false);
  if(!on) return;
  p.mat.opacity=Math.max(0,1-sp.t/dur);
  let k=0; const per=Math.floor(p.arr.length/paths.length);
  for(const path of paths){ for(let i=0;i<per;i++,k++){ const u=((sp.t*1.8)+i/per)%1; p.arr[k].position.copy(path.getPointAt(u)); p.arr[k].visible=true; } }
}

function drawWim(m,dt,sparked){
  const rot=m.angle;
  discs.front.rotation.z=-rot; discs.back.rotation.z=rot;
  drivePulleys.forEach(p=>p.rotation.z=-rot*.44); crank.rotation.z=-rot*.44;
  const lvl=Math.min(1,m.V/20000)+(S.rps>0?.18:0);
  const deg=r=>((r*180/Math.PI)%360+360)%360;
  for(const {mat,beta} of sectorMats.front) setEm(mat, signFront(deg(beta+rot)), .75*Math.min(1,lvl));
  for(const {mat,beta} of sectorMats.back)  setEm(mat, signBack(deg(beta-rot)), .5*Math.min(1,lvl));
  updateWimGeometry(m.gapEff);
  if(Math.abs(loopGap-m.gapEff)>.05) rebuildWimLoop(m.gapEff);
  const Vb=E_BREAK*m.gapEff, cond=Math.min(1,m.V/25000), share=S.strap?1:.08;
  for(const s of [1,-1]){ const w=wimSide[s];
    setEm(w.brass,s,.55*cond);
    setEm(w.tinIn,s,.6*cond*share);
    setEm(w.tinOut,-s,.6*cond*share);
    const nearB=Vb>0?m.V/Vb:0; w.corona.material.opacity = nearB>.8 ? (nearB-.8)*1.6*(.6+.4*Math.random()) : 0;
  }
  setEm(strapMat,0,0);
  blade.rotation.z = THREE.MathUtils.lerp(blade.rotation.z, S.strap?0:1.1, Math.min(1,dt*10));
  lblGap.textContent=`vonkbrug ${nf(m.gapEff,0)} mm`;
  if(sparked){ const a=wimSide[1].ball.position.clone().add(V3(-1.25,0,0)), b=wimSide[-1].ball.position.clone().add(V3(1.25,0,0)); showSpark(wim,b,a,m.spark.E); }
  if(m.spark){ m.spark.t+=dt; fadeSpark(m.spark); }
  if(m.spark && m.spark.t>1.2) m.spark=null;
  const paths = S.strap ? [wimPathMain,wimPathStrap] : [wimPathMain];
  runPulses(wimPulses,paths,m.spark,.7);
  wimLoop.visible=S.showLoop;
  wimLoop.children.forEach((l,i)=>{ if(i===1) l.material.opacity=S.strap?.75:.12; });
}
function drawFric(m,dt){
  globe.rotation.x=-m.angle; fcrank.rotation.x=-m.angle;
  const lvl=Math.min(1,m.V/30000), run=S.rps>0;
  const tmp=new THREE.Vector3();
  for(const {d,mat} of dots){ tmp.copy(d.position).applyEuler(globe.rotation); const front=tmp.z>0; if(front && (run||lvl>.02)){ mat.color.copy(COL.pos).multiplyScalar(.45+.55*Math.min(1,lvl+(run?.35:0))); } else mat.color.setRGB(.33,.38,.4); }
  setEm(M.leather, -1, run?.35*Math.min(1,S.rps/2):0);
  setEm(ironMat,1,.5*lvl); setEm(fBrass,1,.5*lvl);
  setEm(M.water,1,S.bottle?.5*lvl:0);
  bottle.visible=true; wireTop.visible=S.bottle; bottle.children[3].visible=S.bottle;
  // rechterarm
  const tip=FINGER_REST.clone().lerp(FINGER_TOUCH,easeInOut(m.reach));
  setLimb('R',SH_R,tip,V3(-.3,-1,.2));
  const sh = m.spark && m.spark.t<.5 ? (1-m.spark.t/.5) : 0;
  const bodyGlow = S.bottle ? sh*Math.min(1,Math.sqrt(m.spark?m.spark.E*1e3:0)/12) : sh*.15;
  M.skin.emissive.setRGB(.55*bodyGlow,.62*bodyGlow,.9*bodyGlow); M.cloth.emissive.setRGB(.25*bodyGlow,.3*bodyGlow,.45*bodyGlow);
  if(m.spark && m.spark.t===0 && !m.spark.contact){ showSpark(fric,tip.clone(),fricSparkAnchor.clone(),m.spark.E); }
  if(m.spark){ m.spark.t+=dt; fadeSpark(m.spark); if(m.spark.t>1.5) m.spark=null; }
  if(!fricPath) rebuildFricLoop();
  runPulses(fricPulses,[fricPath], (m.spark && S.bottle)?m.spark:null, .8);
  fricLoop.visible=S.showLoop && S.bottle;
}
function easeInOut(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

function drawLabels(){
  const w=canvas.clientWidth,h=canvas.clientHeight, p=new THREE.Vector3();
  for(const L of labels){
    const vis = S.showLabels && L.group.visible;
    if(!vis){ L.el.hidden=true; continue; }
    p.copy(L.pos).applyMatrix4(L.group.matrixWorld).project(camera);
    if(p.z>1||p.x<-1.1||p.x>1.1||p.y<-1.1||p.y>1.1){ L.el.hidden=true; continue; }
    L.el.hidden=false; L.el.style.left=((p.x+1)/2*w)+'px'; L.el.style.top=((1-p.y)/2*h)+'px';
  }
}

const chart=$('chart'), cctx=chart.getContext('2d');
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function drawChart(m){
  const dpr=Math.min(2,window.devicePixelRatio||1), w=chart.clientWidth, h=chart.clientHeight;
  if(chart.width!==Math.round(w*dpr)){ chart.width=Math.round(w*dpr); chart.height=Math.round(h*dpr); }
  cctx.setTransform(dpr,0,0,dpr,0,0); cctx.fillStyle=COL.bg; cctx.fillRect(0,0,w,h);
  const span=12, now=S.t;
  const vmax = S.mode==='wim' ? Math.max(10,S.gap*3*1.15) : 50;
  const x0=48,x1=w-10,y0=h-18,y1=10, X=t=>x0+(t-(now-span))/span*(x1-x0), Y=v=>y0-(v/1000)/vmax*(y0-y1);
  cctx.font='11px "IBM Plex Mono", monospace'; cctx.fillStyle=COL.muted; cctx.textAlign='right'; cctx.textBaseline='middle';
  const st=vmax>60?20:vmax>30?10:5;
  for(let v=0;v<=vmax;v+=st){ cctx.strokeStyle=rgba(COL.muted,.15); cctx.beginPath(); cctx.moveTo(x0,Y(v*1e3)); cctx.lineTo(x1,Y(v*1e3)); cctx.stroke(); cctx.fillText(v+' kV',x0-6,Y(v*1e3)); }
  cctx.textAlign='left'; cctx.fillText('laatste 12 s',x0,h-7);
  if(S.mode==='wim'){ const vb=E_BREAK*S.gap; cctx.strokeStyle=rgba(COL.spark,.5); cctx.setLineDash([4,4]); cctx.beginPath(); cctx.moveTo(x0,Y(vb)); cctx.lineTo(x1,Y(vb)); cctx.stroke(); cctx.setLineDash([]); cctx.textAlign='right'; cctx.fillStyle=COL.muted; cctx.fillText('doorslag',x1,Y(vb)-8); }
  cctx.strokeStyle=COL.brass; cctx.lineWidth=1.8; cctx.beginPath(); let f=false;
  for(const [t,v] of m.history){ if(t<now-span) continue; f?cctx.lineTo(X(t),Y(v)):cctx.moveTo(X(t),Y(v)); f=true; } cctx.stroke();
}
function updateReadout(m){
  const Cc=m.C();
  $('rV').innerHTML=`${nf(m.V/1000,1)}<small>kV</small>`;
  $('rQ').innerHTML=`${nf(Cc*m.V*1e9,0)}<small>nC</small>`;
  $('rE').innerHTML=`${nf(.5*Cc*m.V*m.V*1e3,m.V<5000?2:0)}<small>mJ</small>`;
  $('rB').innerHTML = S.mode==='wim' ? `${nf(E_BREAK*S.gap/1000,0)}<small>kV</small>` : `${nf(m.max/1000,1)}<small>kV</small>`;
  $('speedOut').textContent=`${nf(S.rps,1)} omw/s`; $('gapOut').textContent=`${S.gap} mm`;
  $('crank').textContent = S.rps>0?'Stop met draaien':'Draai aan de slinger';
  const el=$('msg'); if(el.textContent!==S.msg) el.textContent=S.msg; el.classList.toggle('hit',S.hit);
}
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } }

// ================= hoofdlus =================
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  const m=machines[S.mode];
  if(S.mode==='wim'){ const sparked=stepWim(m,dt); drawWim(m,dt,sparked); }
  else { const before=m.spark; stepFric(m,dt); drawFric(m,dt); }
  m.history.push([S.t,m.V]); while(m.history.length&&m.history[0][0]<S.t-13) m.history.shift();
  resize(); placeCam(); renderer.render(scene,camera); drawLabels(); drawChart(m); updateReadout(m);
  requestAnimationFrame(frame);
}

// ================= teksten =================
function renderText(){
  if(S.mode==='wim'){
    $('txt').innerHTML=`<h2>Wat je ziet</h2>
    <p>Twee glazen schijven met tinnen sectoren draaien in tegengestelde zin: de voorste riem loopt recht, de achterste is gekruist. Elke neutralisator verbindt twee diametraal tegenover elkaar liggende sectoren op dezelfde schijf. Staat er tegenover zo’n sector een geladen sector op de andere schijf, dan krijgt hij door influentie lading van het tegengestelde teken. De collectorkammen nemen die lading af: rechts <span class="pos">positief</span>, links <span class="neg">negatief</span>.</p>
    <p>Elke kam is via een koperen staaf verbonden met de binnenbekleding van een Leidse fles, en via de scharnierende ontlader met een bol van de vonkbrug. De twee buitenbekledingen zijn onderling verbonden via een strook onder de flessen met een schakelaar. Zo staan de twee flessen in serie over de vonkbrug. Bij doorslag ontladen ze samen: de stroom loopt van de positieve binnenbekleding over de vonk naar de negatieve binnenbekleding, en in de buitenkring van links naar rechts.</p>
    <p>Open de schakelaar en vergelijk. De flessen hangen dan los; er blijft alleen de kleine strooicapaciteit van de geleiders over. Gevolg: veel vaker een vonk, maar dun en zwak (E = ½·C·U²).</p>`;
  } else {
    $('txt').innerHTML=`<h2>Wat je ziet</h2>
    <p>Rond 1745 werd een glazen bol rondgedraaid en afgewreven met de droge hand of een leren kussen. Het glas wordt daarbij <span class="pos">positief</span>, het kussen <span class="neg">negatief</span> (het kussen is via tafel en bediener geaard). Een ketting voert de lading naar een ijzeren geweerloop die aan zijden koorden hangt: de eerste conductor.</p>
    <p>In Leiden liet Pieter van Musschenbroek in 1746 een draad van de loop in een fles met water hangen. Wie de fles in de ene hand hield en met de andere de loop aanraakte, sloot de kring door het eigen lichaam: water, draad, loop, vinger, armen en borst, en terug naar de hand rond de fles. Water en hand vormen de binnen- en buitenbekleding van wat later de Leidse fles heet.</p>
    <p>Vergelijk de aanraking met en zonder fles. De spanning is ongeveer dezelfde, maar de fles stockeert vele malen meer lading.</p>`;
  }
  $('model').innerHTML=`<b>Model, geen werkelijkheid.</b> De animatie toont de werking kwalitatief; de getallen komen uit een vereenvoudigd RC-model met geschatte ordes van grootte:
  <ul>${S.mode==='wim'?`
    <li>Laadstroom evenredig met het toerental (≈ 2,5 µA per omw/s), met een eenvoudige opstartfactor voor de zelfbekrachtiging.</li>
    <li>Twee flessen van elk 500 pF in serie (250 pF) plus 25 pF strooicapaciteit; met open schakelaar enkel de 25 pF. Lekweerstand 60 GΩ.</li>
    <li>Doorslag bij 3 kV/mm. Dat geldt voor een homogeen veld in droge lucht; tussen bollen en bij grotere afstanden ligt de doorslagspanning per mm in werkelijkheid lager, en vochtige lucht verlaagt ze verder.</li>
    <li>De kleur van sectoren en geleiders toont enkel het teken en een relatieve grootte van de lading. De lichtpuntjes na een vonk tonen de conventionele stroomzin, geen werkelijke snelheid; de stippellijn door het glas is de verplaatsingsstroom in het diëlektricum.</li>`:`
    <li>Laadstroom evenredig met het toerental (≈ 1 µA per omw/s).</li>
    <li>Capaciteit: 15 pF voor de loop alleen, 500 pF met de waterfles (sterk afhankelijk van fles en hand). Lek via lucht en koorden: 20 GΩ.</li>
    <li>De vonk springt over zodra U ≥ 3 kV/mm × afstand vinger–loop.</li>
    <li>De bol wordt voorgesteld als volledig opgeladen na het kussen en volledig ontladen aan de kam. De figuur is gestileerd.</li>`}
  </ul>`;
}

// ================= start =================
setMode('wim');
updateWimGeometry(S.gap); rebuildWimLoop(S.gap); rebuildFricLoop();
requestAnimationFrame(frame);
})();
</script>
