<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thomsons e/m-experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<style>
html,body{margin:0;background:#0F1418}
[hidden]{display:none!important}
#v2d a{color:#8BFFB8}
#v2d a:hover{color:#C6FFDB}
#v2d .svgwrap svg{display:block;width:100%;height:auto}
#v2d .glass{fill:rgba(160,200,220,0.05);stroke:#7E97A6;stroke-width:2}
#v2d .gasglow{fill:rgba(190,120,255,0.20);stroke:none}
#v2d .screen{stroke:#8BFFB8;stroke-width:5;stroke-linecap:round;opacity:.55}
#v2d .metal{fill:#B9C3CA;stroke:none}
#v2d .plate{fill:#5AA9FF;stroke:none}
#v2d .wire{fill:none;stroke:#8A949B;stroke-width:2;stroke-linejoin:round}
#v2d .wire-hot{fill:none;stroke:#D6A84A;stroke-width:2;stroke-linejoin:round}
#v2d .src{fill:#0F1418;stroke:#E9E6DF;stroke-width:2}
#v2d .srcline{stroke:#E9E6DF;stroke-width:2}
#v2d .dot{fill:#E9E6DF}
#v2d .ball{fill:#D6A84A}
#v2d .lbl{fill:#A3ACB3;font:500 13px 'IBM Plex Sans',sans-serif}
#v2d .lbl-c{fill:#A3ACB3;font:500 13px 'IBM Plex Sans',sans-serif;text-anchor:middle}
#v2d .lbl-e{fill:#A3ACB3;font:500 13px 'IBM Plex Sans',sans-serif;text-anchor:end}
#v2d .val{fill:#E9E6DF;font:500 13px 'IBM Plex Mono',monospace;text-anchor:middle}
#v2d .sym{fill:#E9E6DF;font:600 14px 'IBM Plex Sans',sans-serif;text-anchor:middle}
#v2d .coilbody{fill:#2A2318;stroke:#D6A84A;stroke-width:2}
#v2d .stripes{stroke:#D6A84A;stroke-width:1.5;opacity:.7}
#v2d .coil{fill:none;stroke:#FFB070;stroke-width:3;opacity:.25}
#v2d .coil.on{opacity:1}
#v2d .bsym{fill:none;stroke:#FFB070;stroke-width:1.6}
#v2d .earrow{stroke:#5AA9FF;stroke-width:2}
#v2d .earrowhead{fill:#5AA9FF}
#v2d .ticks{stroke:#7E97A6;stroke-width:1.2}
#v2d .inset{fill:#0B1013;stroke:#7E97A6;stroke-width:2}
#v2d .beam-glow{fill:none;stroke:#8BFFB8;stroke-width:6;opacity:.18;stroke-linecap:round;stroke-linejoin:round}
#v2d .beam-core{fill:none;stroke:#8BFFB8;stroke-width:1.4;opacity:.55;stroke-linecap:round;stroke-linejoin:round}
#v2d .beam-flow{fill:none;stroke:#E8FFF0;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 13;animation:flow linear infinite}
#v2d .faint{opacity:.35}
#v2d .hide{display:none}
#v2d .spot{fill:#8BFFB8}
#v2d .spot-halo{fill:#8BFFB8;opacity:.3;filter:blur(5px)}
#v2d .spark{fill:none;stroke:#E4F1FF;stroke-width:2.2;stroke-linejoin:round;animation:spark .18s steps(2) infinite}
#v2d .spark2{fill:none;stroke:#9CC8FF;stroke-width:1.2;stroke-linejoin:round;animation:spark .23s steps(2) infinite reverse}
#v2d .hamA{stroke:#E9E6DF;stroke-width:2;animation:ham .12s steps(1) infinite}
#v2d .hamB{stroke:#E9E6DF;stroke-width:2;animation:ham .12s steps(1) infinite reverse}
#v2d .blade{stroke:#E9E6DF;stroke-width:2.5;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes spark{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
@keyframes ham{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion: reduce){#v2d .beam-flow,#v2d .spark,#v2d .spark2,#v2d .hamA,#v2d .hamB{animation:none}}
#v2d .card{background:#171E23;border:1px solid #2A343B;border-radius:14px;padding:22px}
#v2d .h3{margin:0 0 4px;font:600 13px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#D6A84A}
#v2d .ctl{display:flex;flex-direction:column;gap:6px}
#v2d .ctl label{font:500 14px 'IBM Plex Sans',sans-serif;color:#E9E6DF;display:flex;justify-content:space-between;gap:12px}
#v2d .ctl label span{font-family:'IBM Plex Mono',monospace;color:#8BFFB8}
#v2d input[type=range]{width:100%;accent-color:#D6A84A;height:28px}
#v2d .tog{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #3A464E;background:#11171B;color:#E9E6DF;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
#v2d .tog[aria-pressed=true]{background:#2B2414;border-color:#D6A84A;color:#F5D58E}
#v2d .act{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #8BFFB8;background:#12251B;color:#C6FFDB;font:600 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
#v2d .act:disabled{border-color:#3A464E;background:#11171B;color:#7C868D;cursor:not-allowed}
#v2d .ghost{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #3A464E;background:transparent;color:#A3ACB3;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
#v2d .f{font:400 17px 'IBM Plex Mono',monospace;color:#E9E6DF;line-height:1.9}
#v2d .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25}
#v2d .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
#v2d .frac>span:last-child{padding:0 4px}
#v2d .num{color:#8BFFB8}
#v2d .muted{color:#A3ACB3;font:400 14px 'IBM Plex Sans',sans-serif;line-height:1.5}
#v2d .note{font:400 14px 'IBM Plex Sans',sans-serif;line-height:1.5;color:#E9E6DF;background:#1D252B;border-radius:10px;padding:10px 14px}
#v2d .warn{font:500 14px 'IBM Plex Sans',sans-serif;line-height:1.5;color:#FFD08A;background:#2A2116;border-radius:10px;padding:10px 14px}
#v2d .ok{font:500 14px 'IBM Plex Sans',sans-serif;line-height:1.5;color:#C6FFDB;background:#12251B;border-radius:10px;padding:10px 14px}
#v2d .bar{height:14px;border-radius:7px}
#v2d .tbl{width:100%;border-collapse:collapse;font:400 14px 'IBM Plex Sans',sans-serif;color:#E9E6DF}
#v2d .tbl td{padding:7px 0;border-bottom:1px solid #2A343B}
#v2d .tbl td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace}
#v3d a{color:#8BFFB8}
#v3d a:hover{color:#C6FFDB}
#v3d .stage svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#v3d .grid{fill:none;stroke:#26323A;stroke-width:1}
#v3d .tube{fill:none;stroke:#7E97A6;stroke-width:1.2;opacity:.55}
#v3d .tube-strong{fill:none;stroke:#9FB4C1;stroke-width:1.8;opacity:.8}
#v3d .screen{fill:rgba(139,255,184,0.08);stroke:#8BFFB8;stroke-width:2;opacity:.8}
#v3d .metal{fill:#B9C3CA;stroke:#E9E6DF;stroke-width:.8}
#v3d .plate{fill:rgba(90,169,255,0.35);stroke:#5AA9FF;stroke-width:1.5}
#v3d .coil{fill:none;stroke:#FFB070;stroke-width:5;opacity:.22;stroke-linecap:round}
#v3d .coil.on{opacity:.95}
#v3d .efield{fill:none;stroke:#5AA9FF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#v3d .bfield{fill:none;stroke:#FFB070;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4}
#v3d .fe{fill:none;stroke:#5AA9FF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#v3d .fb{fill:none;stroke:#FFB070;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#v3d .vv{fill:none;stroke:#8BFFB8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#v3d .edot{fill:#E8FFF0}
#v3d .shadow{fill:none;stroke:#8BFFB8;stroke-width:2;opacity:.18;stroke-dasharray:4 5}
#v3d .drop{fill:none;stroke:#8BFFB8;stroke-width:1;opacity:.25;stroke-dasharray:2 4}
#v3d .beam-glow{fill:none;stroke:#8BFFB8;stroke-width:7;opacity:.18;stroke-linecap:round;stroke-linejoin:round}
#v3d .beam-core{fill:none;stroke:#8BFFB8;stroke-width:1.6;opacity:.6;stroke-linecap:round;stroke-linejoin:round}
#v3d .beam-flow{fill:none;stroke:#E8FFF0;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 13;animation:flow linear infinite}
#v3d .spot{fill:#8BFFB8}
#v3d .spot-halo{fill:#8BFFB8;opacity:.35;filter:blur(5px)}
#v3d .axx{stroke:#E9E6DF;stroke-width:2;fill:none}
#v3d .lbl{fill:#A3ACB3;font:500 13px 'IBM Plex Sans',sans-serif}
#v3d .lblw{fill:#E9E6DF;font:600 15px 'IBM Plex Sans',sans-serif}
#v3d .lblE{fill:#7DBBFF;font:600 15px 'IBM Plex Sans',sans-serif}
#v3d .lblB{fill:#FFB070;font:600 15px 'IBM Plex Sans',sans-serif}
#v3d .lblV{fill:#8BFFB8;font:600 15px 'IBM Plex Sans',sans-serif}
#v3d .hide{display:none}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){#v3d .beam-flow{animation:none}}
#v3d .card{background:#171E23;border:1px solid #2A343B;border-radius:14px;padding:22px}
#v3d .h3{margin:0 0 4px;font:600 13px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#D6A84A}
#v3d .ctl{display:flex;flex-direction:column;gap:6px}
#v3d .ctl label{font:500 14px 'IBM Plex Sans',sans-serif;color:#E9E6DF;display:flex;justify-content:space-between;gap:12px}
#v3d .ctl label span{font-family:'IBM Plex Mono',monospace;color:#8BFFB8}
#v3d input[type=range]{width:100%;accent-color:#D6A84A;height:28px}
#v3d .tog{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #3A464E;background:#11171B;color:#E9E6DF;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
#v3d .tog[aria-pressed=true]{background:#2B2414;border-color:#D6A84A;color:#F5D58E}
#v3d .ghost{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #3A464E;background:transparent;color:#E9E6DF;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
#v3d .f{font:400 17px 'IBM Plex Mono',monospace;color:#E9E6DF;line-height:1.9}
#v3d .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25}
#v3d .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
#v3d .frac>span:last-child{padding:0 4px}
#v3d .num{color:#8BFFB8}
#v3d .muted{color:#A3ACB3;font:400 14px 'IBM Plex Sans',sans-serif;line-height:1.5}
#v3d .note{font:400 15px 'IBM Plex Sans',sans-serif;line-height:1.55;color:#E9E6DF;background:#1D252B;border-radius:10px;padding:12px 14px}
#v3d .ok{font:500 14px 'IBM Plex Sans',sans-serif;line-height:1.5;color:#C6FFDB;background:#12251B;border-radius:10px;padding:10px 14px}
#v3d .bar{height:14px;border-radius:7px}
</style>
</head>
<body>
<div id="v2d"></div>
<div id="v3d" hidden></div>
<template id="t2d">
<div style="box-sizing: border-box; width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 24px 56px; display: flex; flex-direction: column; gap: 24px; font-family: 'IBM Plex Sans', sans-serif; color: #E9E6DF; background: #0F1418">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 780px">
<div style="font: 500 13px 'IBM Plex Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #D6A84A">Cambridge, 1897 · J. J. Thomson</div>
<h1 style="margin: 0; font: 600 44px/1.1 Spectral, serif; color: #F3F0E8">De lading-massaverhouding van kathodestralen</h1>
<p style="margin: 0; font: 400 16px/1.55 'IBM Plex Sans', sans-serif; color: #A3ACB3">Stel de inductieklos, de afbuigplaten en de spoelen in. Breng de straal eerst recht (stap 1: snelheid), zet dan de spoelen uit en meet de afbuiging (stap 2: e/m).</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="#3d" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #8BFFB8; background: #12251B; color: #C6FFDB; font: 600 14px 'IBM Plex Sans', sans-serif; text-decoration: none">Bekijk de buis in 3D →</a>
<button class="ghost" onClick="{{reset}}">Alles terugzetten</button>
</div>
</header>

<div class="card svgwrap" style="padding: 12px 12px 8px">
<svg viewBox="0 0 1260 620" role="img" aria-label="Kathodestraalbuis met Ruhmkorff-inductieklos, afbuigplaten, spoelen en scherm">
<path class="wire-hot" d="M200 200 L130 200 L130 430 M289 234 L289 300 L330 300 L330 430 M130 385 L{{gapXL1}} 385 M{{gapXR1}} 385 L330 385"></path>
<circle class="dot" cx="130" cy="385" r="3.5"></circle>
<circle class="dot" cx="330" cy="385" r="3.5"></circle>
<circle class="ball" cx="{{gapXL}}" cy="385" r="9"></circle>
<circle class="ball" cx="{{gapXR}}" cy="385" r="9"></circle>
<polyline class="spark {{sparkCls}}" points="{{sparkPts}}"></polyline>
<polyline class="spark2 {{sparkCls}}" points="{{sparkPts2}}"></polyline>
<text class="lbl-c" x="230" y="366">vonkenbrug s = {{gapTxt}} mm</text>
<text class="val" x="230" y="414">Va ≈ {{vaTxt}}</text>
<rect class="coilbody" x="100" y="430" width="260" height="70" rx="10"></rect>
<path class="stripes" d="{{stripes}}"></path>
<circle class="dot" cx="130" cy="430" r="4"></circle>
<circle class="dot" cx="330" cy="430" r="4"></circle>
<text class="sym" x="118" y="452">−</text>
<text class="sym" x="344" y="452">+</text>
<path class="wire" d="M160 500 L160 560 L76 560 M44 560 L30 560 L30 590 L150 590 M186 590 L300 590 L300 500"></path>
<circle class="src" cx="60" cy="560" r="16"></circle>
<line class="srcline" x1="44" y1="560" x2="76" y2="560"></line>
<line class="hamA" x1="150" y1="590" x2="186" y2="590"></line>
<line class="hamB" x1="150" y1="590" x2="182" y2="576"></line>
<circle class="dot" cx="150" cy="590" r="3"></circle>
<circle class="dot" cx="186" cy="590" r="3"></circle>
<text class="lbl-c" x="230" y="526">Ruhmkorff-inductieklos</text>
<text class="lbl" x="84" y="548">primair</text>
<text class="lbl" x="196" y="612">onderbreker (Wagnerhamer)</text>

<path class="wire" d="M455 222 L455 454 M455 486 L455 575 L610 575 L610 420 M610 380 L610 110 L525 110 L525 178"></path>
<circle class="src" cx="455" cy="470" r="16"></circle>
<line class="srcline" x1="455" y1="454" x2="455" y2="486"></line>
<text class="sym" x="474" y="458">−</text>
<text class="sym" x="474" y="496">+</text>
<text class="lbl-e" x="434" y="466">accucellen</text>
<text class="val" x="395" y="486">Vp = {{vpTxt}} V</text>
<line class="blade" x1="610" y1="420" x2="{{swEx}}" y2="{{swEy}}"></line>
<circle class="dot" cx="610" cy="420" r="3.5"></circle>
<circle class="dot" cx="610" cy="380" r="3.5"></circle>
<text class="lbl" x="624" y="404">S<tspan dy="4" font-size="10">E</tspan></text>

<path class="wire" d="M482 264 L482 530 L640 530 M680 530 L784 530 M816 530 L864 530 M896 530 L940 530 L940 550 L498 550 L498 264"></path>
<line class="blade" x1="640" y1="530" x2="{{swBx}}" y2="{{swBy}}"></line>
<circle class="dot" cx="640" cy="530" r="3.5"></circle>
<circle class="dot" cx="680" cy="530" r="3.5"></circle>
<text class="lbl" x="652" y="518">S<tspan dy="4" font-size="10">B</tspan></text>
<circle class="src" cx="800" cy="530" r="16"></circle>
<line class="srcline" x1="784" y1="530" x2="816" y2="530"></line>
<circle class="src" cx="880" cy="530" r="16"></circle>
<text class="sym" x="880" y="535">A</text>
<text class="lbl-c" x="800" y="502">spoelbron</text>
<text class="val" x="880" y="578">I = {{iTxt}} A</text>

<path class="gasglow {{gasCls}}" d="M180 166 L600 166 L1040 56 L1040 344 L600 234 L180 234 A34 34 0 0 1 180 166 Z"></path>
<path class="glass" d="M180 166 L600 166 L1040 56 L1040 344 L600 234 L180 234 A34 34 0 0 1 180 166 Z"></path>
<line class="screen" x1="1040" y1="58" x2="1040" y2="342"></line>
<rect class="metal" x="196" y="178" width="8" height="44" rx="3"></rect>
<rect class="metal" x="286" y="168" width="6" height="28"></rect>
<rect class="metal" x="286" y="204" width="6" height="28"></rect>
<rect class="metal" x="336" y="168" width="6" height="29"></rect>
<rect class="metal" x="336" y="203" width="6" height="29"></rect>
<rect class="plate" x="440" y="176" width="100" height="5" rx="1"></rect>
<rect class="plate" x="440" y="219" width="100" height="5" rx="1"></rect>
<text class="sym" x="432" y="184">+</text>
<text class="sym" x="432" y="227">−</text>
<g class="{{eArrowCls}}">
<line class="earrow" x1="465" y1="185" x2="465" y2="208"></line>
<line class="earrow" x1="490" y1="185" x2="490" y2="208"></line>
<line class="earrow" x1="515" y1="185" x2="515" y2="208"></line>
<polygon class="earrowhead" points="460,207 470,207 465,215"></polygon>
<polygon class="earrowhead" points="485,207 495,207 490,215"></polygon>
<polygon class="earrowhead" points="510,207 520,207 515,215"></polygon>
</g>
<circle class="coil {{coilCls}}" cx="490" cy="200" r="64"></circle>
<g class="{{bSymCls}}">
<circle class="bsym" cx="470" cy="150" r="6"></circle>
<path class="bsym" d="M466 146 L474 154 M474 146 L466 154"></path>
<circle class="bsym" cx="510" cy="150" r="6"></circle>
<path class="bsym" d="M506 146 L514 154 M514 146 L506 154"></path>
<circle class="bsym" cx="470" cy="250" r="6"></circle>
<path class="bsym" d="M466 246 L474 254 M474 246 L466 254"></path>
<circle class="bsym" cx="510" cy="250" r="6"></circle>
<path class="bsym" d="M506 246 L514 254 M514 246 L506 254"></path>
</g>

<g class="{{beamCls}}">
<path class="beam-glow" d="{{beamPath}}"></path>
<path class="beam-core" d="{{beamPath}}"></path>
<path class="beam-flow" d="{{beamPath}}" style="animation-duration: {{flowDur}}"></path>
<circle class="spot-halo" cx="{{endX}}" cy="{{endY}}" r="11"></circle>
<circle class="spot" cx="{{endX}}" cy="{{endY}}" r="3.5"></circle>
</g>

<text class="lbl-c" x="200" y="156">K (−)</text>
<text class="lbl-c" x="314" y="156">A (+) en spleten</text>
<text class="lbl" x="560" y="96">afbuigplaten (L = 5 cm, d = 1,5 cm)</text>
<text class="lbl-e" x="420" y="128">spoelen (B ⊗)</text>
<text class="lbl-c" x="1040" y="372">fosforescerend glas</text>
<text class="lbl-c" x="1040" y="390">D = 25 cm na de platen</text>
<text class="lbl" x="700" y="320">{{tubeMsg}}</text>

<text class="lbl-c" x="1166" y="100">vooraanzicht scherm</text>
<circle class="inset" cx="1166" cy="200" r="86"></circle>
<path class="ticks" d="{{insetTicks}}"></path>
<text class="lbl" x="1196" y="138">+5 cm</text>
<text class="lbl" x="1196" y="270">−5 cm</text>
<circle class="spot-halo {{insetCls}}" cx="1166" cy="{{insetY}}" r="10"></circle>
<circle class="spot {{insetCls}}" cx="1166" cy="{{insetY}}" r="4.5"></circle>
<text class="val" x="1166" y="314">Y = {{yScreenTxt}}</text>
<text class="lbl-c" x="1166" y="334">schematisch, niet op schaal</text>
</svg>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div class="card" style="display: flex; flex-direction: column; gap: 16px">
<h2 class="h3">Ruhmkorff-klos en buis</h2>
<button class="tog" aria-pressed="{{powerP}}" onClick="{{togglePower}}">Inductieklos {{powerTxt}}</button>
<div class="ctl">
<label for="gap">Afstand vonkenbrug s <span>{{gapTxt}} mm</span></label>
<input id="gap" type="range" min="0.5" max="5" step="0.1" value="{{gap}}" onChange="{{setGap}}">
</div>
<p class="muted" style="margin: 0">De vonk springt over zodra Va ≈ 3 kV/mm · s. Zo begrenst en meet de vonkenbrug de versnelspanning: Va ≈ <span class="num">{{vaTxt}}</span>.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font: 500 14px 'IBM Plex Sans', sans-serif">Restgas in de buis</div>

<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u) { Object.assign(this.state, u); if (this._update) this._update(); }
}
const EVENTS = { onclick: 'click', onchange: 'input', onpointerdown: 'pointerdown', onpointermove: 'pointermove',
  onpointerup: 'pointerup', onpointerleave: 'pointerleave' };
const KEY = /\{\{\s*([A-Za-z_$][\w$]*)\s*\}\}/g;
const fill = (s, v) => s.replace(KEY, (_, k) => (v[k] === undefined || v[k] === null) ? '' : String(v[k]));
const one = (s) => { const m = s.trim().match(/^\{\{\s*([A-Za-z_$][\w$]*)\s*\}\}$/); return m && m[1]; };

function mount(root, tpl, Comp) {
  const frag = tpl.content.cloneNode(true);
  const comp = new Comp({});
  let vals = {};
  const binds = [];
  const walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    if (n.nodeType === 3) {
      if (n.data.includes('{{')) { const t = n.data; binds.push(() => { const s = fill(t, vals); if (n.data !== s) n.data = s; }); }
      continue;
    }
    if (n.localName === 'sc-if') {
      const k = one(n.getAttribute('value') || '');
      n.removeAttribute('value'); n.removeAttribute('hint-placeholder-val');
      binds.push(() => { n.style.display = vals[k] ? 'contents' : 'none'; });
      continue;
    }
    for (const a of Array.from(n.attributes)) {
      const name = a.name.toLowerCase(), v = a.value;
      if (!v.includes('{{')) continue;
      const k = one(v);
      if (EVENTS[name] && k) {
        n.removeAttribute(a.name);
        n.addEventListener(EVENTS[name], (e) => { const f = vals[k]; if (typeof f === 'function') f(e); });
      } else if (name === 'disabled' && k) {
        n.removeAttribute(a.name);
        binds.push(() => { n.disabled = !!vals[k]; });
      } else if (name === 'value' && k && 'value' in n) {
        n.removeAttribute(a.name);
        binds.push(() => { const s = String(vals[k]); if (n.value !== s) n.value = s; });
      } else {
        const t = v;
        binds.push(() => { const s = fill(t, vals); if (n.getAttribute(a.name) !== s) n.setAttribute(a.name, s); });
      }
    }
  }
  comp._update = () => { vals = comp.renderVals(); for (const b of binds) b(); };
  comp._update();
  root.appendChild(frag);
}

const C2D = (() => { 
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial();
  }
  initial() {
    return { power: true, gap: 0.8, good: true, eOn: true, cells: 110, bOn: false, I: 0.4, s1: null, s2: null };
  }
  dec(x, n) { return x.toFixed(n).replace('.', ','); }
  sci(x, n, unit) {
    if (!x || !isFinite(x)) return '0' + (unit ? ' ' + unit : '');
    const sup = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
    let e = Math.floor(Math.log10(Math.abs(x)));
    let m = x / Math.pow(10, e);
    if (Math.abs(m) >= 9.995) { m = m / 10; e += 1; }
    const es = String(e).split('').map(c => sup[c]).join('');
    return m.toFixed(n).replace('.', ',') + ' · 10' + es + (unit ? ' ' + unit : '');
  }
  renderVals() {
    const s = this.state;
    const EM = 1.759e11, MU0 = 4e-7 * Math.PI, N = 100, R = 0.05, d = 0.015, L = 0.05, D = 0.25;
    const X0 = 440, PXM = 2000, Y0 = 200, PYM = 2400;
    const Va = s.gap * 3000;
    const v = Math.sqrt(2 * EM * Va);
    const Vp = s.cells * 2;
    const Enom = Vp / d;
    const E = s.eOn && s.good ? Enom : 0;
    const B = s.bOn ? MU0 * N * s.I / (2 * R) : 0;
    const a = EM * (E - v * B);
    const toY = (y) => Y0 - y * PYM;
    const pts = [[204, 200], [X0, 200]];
    let end = 'screen';
    let Y = 0;
    const yL = 0.5 * a * Math.pow(L / v, 2);
    if (Math.abs(yL) > d / 2 - 0.0006) {
      end = 'plate';
      const uEnd = v * Math.sqrt((d - 0.0012) / Math.abs(a));
      for (let i = 1; i <= 20; i++) { const u = uEnd * i / 20; pts.push([X0 + u * PXM, toY(0.5 * a * Math.pow(u / v, 2))]); }
    } else {
      for (let i = 1; i <= 20; i++) { const u = L * i / 20; pts.push([X0 + u * PXM, toY(0.5 * a * Math.pow(u / v, 2))]); }
      const th = a * L / (v * v);
      let endX = 1040;
      for (let xp = 542; xp <= 1040; xp += 2) {
        const yp = yL + th * (xp - 540) / PXM;
        const h = xp < 600 ? 34 : 34 + (xp - 600) * 110 / 440;
        if (Math.abs(yp * PYM) > h - 1) { end = 'wall'; endX = xp; break; }
      }
      Y = yL + th * (endX - 540) / PXM;
      pts.push([endX, toY(Y)]);
    }
    const last = pts[pts.length - 1];
    const beamPath = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');

    const gapPx = s.gap * 10;
    const gxl = 230 - gapPx / 2 - 9, gxr = 230 + gapPx / 2 + 9;
    const sx1 = gxl + 8, sx2 = gxr - 8;
    const sp = [], sp2 = [];
    for (let i = 0; i <= 6; i++) {
      const x = sx1 + (sx2 - sx1) * i / 6;
      sp.push(x.toFixed(1) + ',' + (385 + (i % 2 ? -5 : 4) * (i === 0 || i === 6 ? 0 : 1)));
      sp2.push(x.toFixed(1) + ',' + (385 + (i % 2 ? 4 : -4) * (i === 0 || i === 6 ? 0 : 1)));
    }
    let stripes = '';
